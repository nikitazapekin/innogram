user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'cache=$upstream_cache_status rt=$request_time';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    application/javascript
    application/json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

  proxy_cache_path /var/cache/nginx/innogram
    levels=1:2
    keys_zone=innogram_cache:32m
    max_size=512m
    inactive=60m
    use_temp_path=off;

  proxy_cache_path /var/cache/nginx/static
    levels=1:2
    keys_zone=static_cache:16m
    max_size=1g
    inactive=7d
    use_temp_path=off;

  map $http_authorization $skip_cache {
    default 0;
    "~." 1;
  }

  map $request_method $skip_cache_method {
    default 1;
    GET 0;
    HEAD 0;
  }

  map "$skip_cache$skip_cache_method" $bypass_cache {
    default 0;
    "00" 0;
    "01" 0;
    "10" 1;
    "11" 1;
  }

  include /etc/nginx/conf.d/*.conf;
}
