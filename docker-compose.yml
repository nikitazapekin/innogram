services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '16379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":${MINIO_CONSOLE_PORT:-9001}"
    ports:
      - '${MINIO_PORT:-9000}:${MINIO_PORT:-9000}'
      - '${MINIO_CONSOLE_PORT:-9001}:${MINIO_CONSOLE_PORT:-9001}'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:${MINIO_PORT:-9000}/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-innogram}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_LOG_DIRS: /var/lib/kafka/logs
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  core:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      CORE_HTTP_PORT: ${CORE_HTTP_PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}
      CORE_REDIS_URL: redis://redis:6379
      CORE_REDIS_KEY_PREFIX: ${CORE_REDIS_KEY_PREFIX:-innogram:core}
      KAFKA_BROKERS: kafka:9092
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT:-9000}
      AUTH_SERVICE_URL: http://auth:${AUTH_HTTP_PORT:-3002}
    ports:
      - '${CORE_HTTP_PORT:-3001}:${CORE_HTTP_PORT:-3001}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_healthy

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      AUTH_HTTP_PORT: ${AUTH_HTTP_PORT:-3002}
      AUTH_REDIS_URL: redis://redis:6379
      AUTH_CORE_HTTP_URL: http://core:${CORE_HTTP_PORT:-3001}
      API_GATEWAY_URL: http://gateway:${API_GATEWAY_PORT:-3004}
      KAFKA_BROKERS: kafka:9092
    ports:
      - '${AUTH_HTTP_PORT:-3002}:${AUTH_HTTP_PORT:-3002}'
    depends_on:
      redis:
        condition: service_healthy
      core:
        condition: service_started
      kafka:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: apps/notifications/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      NOTIFICATIONS_HTTP_PORT: ${NOTIFICATIONS_HTTP_PORT:-3005}
      NOTIFICATIONS_POSTGRES_HOST: postgres
      NOTIFICATIONS_POSTGRES_PORT: 5432
      NOTIFICATIONS_POSTGRES_USER: ${POSTGRES_USER:-postgres}
      NOTIFICATIONS_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      NOTIFICATIONS_POSTGRES_DATABASE: ${POSTGRES_DATABASE:-innogram}
      KAFKA_BROKERS: kafka:9092
    ports:
      - '${NOTIFICATIONS_HTTP_PORT:-3005}:${NOTIFICATIONS_HTTP_PORT:-3005}'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: ${API_GATEWAY_PORT:-3004}
      AUTH_SERVICE_URL: http://auth:${AUTH_HTTP_PORT:-3002}
      CORE_URL: http://core:${CORE_HTTP_PORT:-3001}
    ports:
      - '${API_GATEWAY_PORT:-3004}:${API_GATEWAY_PORT:-3004}'
    depends_on:
      - auth
      - core

  client:
    build:
      context: .
      dockerfile: apps/client_app/Dockerfile
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL:-http://localhost:3004}
        NEXT_PUBLIC_CORE_URL: ${NEXT_PUBLIC_CORE_URL:-http://localhost:3001}
        NEXT_PUBLIC_IMAGE_REMOTE_HOSTS: ${NEXT_PUBLIC_IMAGE_REMOTE_HOSTS:-localhost:9000}
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-3000}:3000'
    depends_on:
      - gateway

  nginx:
    build:
      context: ./deploy/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
    environment:
      NGINX_CLIENT_UPSTREAM: client:3000
      NGINX_GATEWAY_UPSTREAM: gateway:${API_GATEWAY_PORT:-3004}
      NGINX_CORE_UPSTREAM: core:${CORE_HTTP_PORT:-3001}
      NGINX_AUTH_UPSTREAM: auth:${AUTH_HTTP_PORT:-3002}
      NGINX_MINIO_UPSTREAM: minio:${MINIO_PORT:-9000}
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:-localhost}
      MINIO_BUCKET: ${MINIO_BUCKET:-main}
    volumes:
      - nginx_cache:/var/cache/nginx
    depends_on:
      - client
      - gateway
      - core
      - auth
      - minio
    profiles:
      - proxy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    profiles:
      - monitoring

  loki:
    image: grafana/loki:2.9.0
    restart: unless-stopped
    volumes:
      - ./loki.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/local-config.yaml
    profiles:
      - monitoring

  promtail:
    image: grafana/promtail:2.9.0
    restart: unless-stopped
    ports:
      - '9080:9080'
    volumes:
      - ./promtal.yaml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./datasourses.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./grafana/dashboards:/etc/grafana/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - '3003:3000'
    depends_on:
      - prometheus
      - loki
    profiles:
      - monitoring

volumes:
  minio_data:
  postgres_data:
  redis_data:
  kafka_data:
  nginx_cache:
  prometheus_data:
  loki_data:
  grafana_data:
