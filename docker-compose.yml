services:
  app:
    build:
      context: .
      dockerfile: apps/core_microservice/Dockerfile
    environment:
      CORE_HTTP_PORT: ${CORE_HTTP_PORT:-5000}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}
    ports:
      - '${CORE_HTTP_PORT:-5000}:${CORE_HTTP_PORT:-5000}'
