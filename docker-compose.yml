services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    ports:
      - ${MINIO_PORT}:${MINIO_PORT}
      - ${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DATABASE:-innogram}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: apps/core/Dockerfile
    environment:
      CORE_HTTP_PORT: ${CORE_HTTP_PORT:-3001}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE is required}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      SWAGGER_PATH: ${SWAGGER_PATH:-api/docs}
      CORE_REDIS_URL: redis://redis:6379
      CORE_REDIS_KEY_PREFIX: ${CORE_REDIS_KEY_PREFIX:-innogram:core}
      ASSET_URL_CACHE_TTL_SECONDS: ${ASSET_URL_CACHE_TTL_SECONDS:-10800}
      POSTS_FEED_CACHE_TTL_SECONDS: ${POSTS_FEED_CACHE_TTL_SECONDS:-30}
    ports:
      - '${CORE_HTTP_PORT:-3001}:${CORE_HTTP_PORT:-3001}'
    depends_on:
      - postgres
      - redis

volumes:
  minio-data:
    driver: local
  postgres_data:
  redis_data:
