apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: innogram
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notifications
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifications
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: innogram
    spec:
      containers:
        - name: notifications
          image: innogram/notifications:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3005 }]
          env:
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: innogram-config, key: NODE_ENV } }
            - name: NOTIFICATIONS_HTTP_PORT
              valueFrom:
                { configMapKeyRef: { name: innogram-config, key: NOTIFICATIONS_HTTP_PORT } }
            - name: NOTIFICATIONS_POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: innogram-config, key: POSTGRES_HOST } }
            - name: NOTIFICATIONS_POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: POSTGRES_PORT } }
            - name: NOTIFICATIONS_POSTGRES_USER
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: POSTGRES_USER } }
            - name: NOTIFICATIONS_POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: POSTGRES_PASSWORD } }
            - name: NOTIFICATIONS_POSTGRES_DATABASE
              valueFrom: { configMapKeyRef: { name: innogram-config, key: POSTGRES_DATABASE } }
            - name: KAFKA_BROKERS
              valueFrom: { configMapKeyRef: { name: innogram-config, key: KAFKA_BROKERS } }
          readinessProbe:
            tcpSocket: { port: 3005 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3005 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: notifications
  namespace: innogram
  labels:
    app.kubernetes.io/name: notifications
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  selector: { app.kubernetes.io/name: notifications }
  ports: [{ port: 3005, targetPort: 3005 }]
