apiVersion: v1
kind: ConfigMap
metadata:
  name: innogram-config
  namespace: innogram
  labels:
    app.kubernetes.io/part-of: innogram
data:
  NODE_ENV: 'production'
  POSTGRES_HOST: 'postgres'
  POSTGRES_PORT: '5432'
  POSTGRES_DATABASE: 'innogram'
  REDIS_HOST: 'redis'
  REDIS_PORT: '6379'
  KAFKA_BROKERS: 'kafka:9092'
  MINIO_ENDPOINT: 'minio'
  MINIO_PORT: '9000'
  MINIO_BUCKET: 'main'
  MINIO_USE_SSL: 'false'
  CORE_HTTP_PORT: '3001'
  AUTH_HTTP_PORT: '3002'
  API_GATEWAY_PORT: '3004'
  NOTIFICATIONS_HTTP_PORT: '3005'
  SWAGGER_PATH: 'api/docs'
  AUTH_SWAGGER_PATH: 'api/docs'
  CORE_REDIS_KEY_PREFIX: 'innogram:core'
  AUTH_REDIS_KEY_PREFIX: 'innogram:auth'
  MENTION_EVENTS_TOPIC: 'mention.events'
  AUTH_CORE_SIGNUP_TOPIC: 'auth.signup'
  ASSET_URL_CACHE_TTL_SECONDS: '10800'
  POSTS_FEED_CACHE_TTL_SECONDS: '30'
  SLOW_QUERY_THRESHOLD_MS: '100'
  RUN_MIGRATIONS: 'true'
  NEXT_PUBLIC_API_GATEWAY_URL: 'http://api-gateway:3004'
  NEXT_PUBLIC_CORE_URL: 'http://core:3001'
  NEXT_PUBLIC_IMAGE_REMOTE_HOSTS: 'minio:9000'
