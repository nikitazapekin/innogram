apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: innogram
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: innogram
    spec:
      containers:
        - name: api-gateway
          image: innogram/api-gateway:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3004 }]
          env:
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: innogram-config, key: NODE_ENV } }
            - name: API_GATEWAY_PORT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: API_GATEWAY_PORT } }
            - name: AUTH_SERVICE_URL
              value: 'http://auth:3002'
            - name: CORE_URL
              value: 'http://core:3001'
          readinessProbe:
            tcpSocket: { port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3004 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 256Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: innogram
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  selector: { app.kubernetes.io/name: api-gateway }
  ports: [{ port: 3004, targetPort: 3004 }]
