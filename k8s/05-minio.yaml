apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: innogram
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: innogram
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: innogram
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: innogram
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: innogram
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          command: [minio, server, /data, --console-address, ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: MINIO_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: MINIO_PASSWORD } }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-pvc }

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: innogram
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: innogram
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
