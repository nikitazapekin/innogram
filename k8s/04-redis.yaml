apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: innogram
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: innogram
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: innogram
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: innogram
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: innogram
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          command: [redis-server, --appendonly, 'yes']
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: [redis-cli, ping] }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-pvc }

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: innogram
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: innogram
spec:
  selector: { app.kubernetes.io/name: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
