apiVersion: apps/v1
kind: Deployment
metadata:
  name: core
  namespace: innogram
  labels:
    app.kubernetes.io/name: core
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: innogram
    spec:
      containers:
        - name: core
          image: innogram/core:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3001 }]
          env:
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: innogram-config, key: NODE_ENV } }
            - name: CORE_HTTP_PORT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: CORE_HTTP_PORT } }
            - name: POSTGRES_HOST
              valueFrom: { configMapKeyRef: { name: innogram-config, key: POSTGRES_HOST } }
            - name: POSTGRES_PORT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: POSTGRES_PORT } }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DATABASE
              valueFrom: { configMapKeyRef: { name: innogram-config, key: POSTGRES_DATABASE } }
            - name: RUN_MIGRATIONS
              valueFrom: { configMapKeyRef: { name: innogram-config, key: RUN_MIGRATIONS } }
            - name: SWAGGER_PATH
              valueFrom: { configMapKeyRef: { name: innogram-config, key: SWAGGER_PATH } }
            - name: CORE_REDIS_URL
              value: 'redis://redis:6379'
            - name: CORE_REDIS_KEY_PREFIX
              valueFrom: { configMapKeyRef: { name: innogram-config, key: CORE_REDIS_KEY_PREFIX } }
            - name: KAFKA_BROKERS
              valueFrom: { configMapKeyRef: { name: innogram-config, key: KAFKA_BROKERS } }
            - name: MINIO_ENDPOINT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: MINIO_ENDPOINT } }
            - name: MINIO_PORT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: MINIO_PORT } }
            - name: MINIO_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: MINIO_ACCESS_KEY } }
            - name: MINIO_SECRET_KEY
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: MINIO_SECRET_KEY } }
            - name: MINIO_USE_SSL
              valueFrom: { configMapKeyRef: { name: innogram-config, key: MINIO_USE_SSL } }
            - name: MINIO_BUCKET
              valueFrom: { configMapKeyRef: { name: innogram-config, key: MINIO_BUCKET } }
            - name: AUTH_SERVICE_URL
              value: 'http://auth:3002'
            - name: ASSET_URL_CACHE_TTL_SECONDS
              valueFrom:
                { configMapKeyRef: { name: innogram-config, key: ASSET_URL_CACHE_TTL_SECONDS } }
            - name: POSTS_FEED_CACHE_TTL_SECONDS
              valueFrom:
                { configMapKeyRef: { name: innogram-config, key: POSTS_FEED_CACHE_TTL_SECONDS } }
            - name: SLOW_QUERY_THRESHOLD_MS
              valueFrom:
                { configMapKeyRef: { name: innogram-config, key: SLOW_QUERY_THRESHOLD_MS } }
            - name: MENTION_EVENTS_TOPIC
              valueFrom: { configMapKeyRef: { name: innogram-config, key: MENTION_EVENTS_TOPIC } }
          readinessProbe:
            httpGet: { path: /api/docs, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/docs, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: innogram
  labels:
    app.kubernetes.io/name: core
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  selector: { app.kubernetes.io/name: core }
  ports: [{ port: 3001, targetPort: 3001 }]
