apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: innogram
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth
        app.kubernetes.io/component: microservice
        app.kubernetes.io/part-of: innogram
    spec:
      containers:
        - name: auth
          image: innogram/auth:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3002 }]
          env:
            - name: NODE_ENV
              valueFrom: { configMapKeyRef: { name: innogram-config, key: NODE_ENV } }
            - name: AUTH_HTTP_PORT
              valueFrom: { configMapKeyRef: { name: innogram-config, key: AUTH_HTTP_PORT } }
            - name: AUTH_REDIS_URL
              value: 'redis://redis:6379'
            - name: AUTH_REDIS_KEY_PREFIX
              valueFrom: { configMapKeyRef: { name: innogram-config, key: AUTH_REDIS_KEY_PREFIX } }
            - name: AUTH_CORE_HTTP_URL
              value: 'http://core:3001'
            - name: API_GATEWAY_URL
              value: 'http://api-gateway:3004'
            - name: KAFKA_BROKERS
              valueFrom: { configMapKeyRef: { name: innogram-config, key: KAFKA_BROKERS } }
            - name: AUTH_SWAGGER_PATH
              valueFrom: { configMapKeyRef: { name: innogram-config, key: AUTH_SWAGGER_PATH } }
            - name: AUTH_SERVICE_NAME
              value: 'auth-microservice'
            - name: AUTH_SERVER_REQUEST_TIMEOUT_MS
              value: '30000'
            - name: AUTH_JWT_ACCESS_TOKEN_EXPIRES_IN
              value: '15m'
            - name: AUTH_JWT_ACCESS_TOKEN_KEY_ID
              valueFrom:
                { secretKeyRef: { name: innogram-secrets, key: AUTH_JWT_ACCESS_TOKEN_KEY_ID } }
            - name: AUTH_JWT_ACCESS_TOKEN_PRIVATE_KEY
              valueFrom:
                { secretKeyRef: { name: innogram-secrets, key: AUTH_JWT_ACCESS_TOKEN_PRIVATE_KEY } }
            - name: AUTH_JWT_REFRESH_TOKEN_EXPIRES_IN
              value: '7d'
            - name: AUTH_JWT_REFRESH_TOKEN_SECRET
              valueFrom:
                { secretKeyRef: { name: innogram-secrets, key: AUTH_JWT_REFRESH_TOKEN_SECRET } }
            - name: AUTH_PASSWORD_SALT_ROUNDS
              value: '12'
            - name: AUTH_GOOGLE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: innogram-secrets, key: AUTH_GOOGLE_CLIENT_ID } }
            - name: AUTH_GOOGLE_CLIENT_SECRET
              valueFrom:
                { secretKeyRef: { name: innogram-secrets, key: AUTH_GOOGLE_CLIENT_SECRET } }
            - name: AUTH_GOOGLE_REDIRECT_URI
              value: 'http://auth:3002/auth/google/callback'
            - name: AUTH_ALLOWED_OAUTH_REDIRECT_ORIGINS
              valueFrom:
                {
                  secretKeyRef:
                    { name: innogram-secrets, key: AUTH_ALLOWED_OAUTH_REDIRECT_ORIGINS },
                }
            - name: AUTH_CORE_SIGNUP_TOPIC
              valueFrom: { configMapKeyRef: { name: innogram-config, key: AUTH_CORE_SIGNUP_TOPIC } }
          readinessProbe:
            httpGet: { path: /api/docs, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/docs, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: innogram
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: microservice
    app.kubernetes.io/part-of: innogram
spec:
  selector: { app.kubernetes.io/name: auth }
  ports: [{ port: 3002, targetPort: 3002 }]
