openapi: 3.0.3
info:
  title: Innogram Auth API
  description: Authentication service — registration, login, OAuth, token refresh, and validation.
  version: 1.0.0
servers:
  - url: http://localhost:3002
    description: Local development
tags:
  - name: auth
    description: Authentication endpoints
  - name: system
    description: Health and service info
paths:
  /:
    get:
      tags: [system]
      summary: Service status
      responses:
        '200':
          description: Service is running
  /health:
    get:
      tags: [system]
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: JSON Web Key Set for access token verification
      responses:
        '200':
          description: JWKS document
  /auth/register:
    post:
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Validation error
        '409':
          description: Email already registered
  /auth/login:
    post:
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful — access token returned, refresh token set as cookie
        '401':
          description: Invalid credentials
  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token using refresh token cookie
      responses:
        '200':
          description: New access token issued
        '401':
          description: Invalid or expired refresh token
  /auth/logout:
    post:
      tags: [auth]
      summary: Logout and invalidate refresh session
      responses:
        '204':
          description: Logged out successfully
  /auth/validate:
    get:
      tags: [auth]
      summary: Validate Bearer access token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token is valid
        '401':
          description: Invalid or missing token
  /auth/google:
    get:
      tags: [auth]
      summary: Start Google OAuth flow
      responses:
        '302':
          description: Redirect to Google consent screen
  /auth/google/callback:
    get:
      tags: [auth]
      summary: Google OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to client app with tokens
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
